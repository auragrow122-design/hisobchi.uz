<style>
:root{--bg:#000;--bg2:#05070F;--sf:#0A0F1E;--ink:#fff;--mut:#8C9ABF;--ln:#1B2646;--acc:#2F6BFF;--acc2:#1A3DA8;--tq:#8FB4FF;--ok:#8FB4FF;--bad:#fff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.hero{position:relative;overflow:hidden;text-align:center;padding:70px 0 30px}
.fl3{position:absolute;left:-50%;right:-50%;bottom:0;height:62%;background:linear-gradient(var(--acc) 1px,transparent 1px) 0 0/100% 56px,linear-gradient(90deg,var(--acc) 1px,transparent 1px) 0 0/56px 100%;opacity:.28;transform:perspective(420px) rotateX(62deg);transform-origin:bottom;animation:gm 3s linear infinite;mask-image:linear-gradient(transparent,#000 70%)}

.o1{width:480px;height:480px;left:-120px;top:-100px}.o2{width:380px;height:380px;right:-90px;top:120px;background:#1A3DA8;animation-delay:-6s}

.hero .w{position:relative}

.cd:hover{border-color:#3A5BC4}.cd:hover::before{opacity:1}.cd>*{position:relative}

.cta{position:relative;text-align:center;background:radial-gradient(circle at 50% 0,#2F6BFF,#0B1E6B 60%,#000);border:1px solid #3A5BC4;border-radius:32px;padding:80px 22px;overflow:hidden}

.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}

.pn{background:linear-gradient(180deg,#0A1022,#05080F);border:1px solid var(--ln);border-radius:22px;padding:22px;margin-bottom:16px}.pn h2{font-size:22px;margin-bottom:12px}
